<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>工具合集 — JSON 编辑 & URL 编码</title>
  <style>
    :root{--bg:#f6f8fa;--accent:#667eea}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .wrap{display:flex;height:100vh}
    .sidebar{width:240px;background:#ffffff;border-right:1px solid #e6e9ef;padding:20px;box-sizing:border-box}
    .brand{font-weight:700;color:var(--accent);margin-bottom:16px}
    .nav{list-style:none;padding:0;margin:0}
    .nav li{margin-bottom:8px}
    .nav button{width:100%;text-align:left;padding:10px 12px;border:0;border-radius:6px;background:#fff;cursor:pointer;color:#333;font-weight:600}
    .nav button.active{background:linear-gradient(90deg,var(--accent),#5568d3);color:#fff}
    .nav .small{display:block;font-weight:400;font-size:12px;color:#666;margin-top:4px}
    .actions{margin-top:18px}
    .actions a{display:inline-block;margin-right:8px;padding:8px 10px;background:#f0f0f0;border-radius:6px;color:#333;text-decoration:none;font-size:13px}
    .main{flex:1;background:var(--bg);display:flex;flex-direction:column}
    .toolbar{padding:12px 16px;border-bottom:1px solid #e6e9ef;background:#fff;display:flex;align-items:center;gap:12px}
    .title{font-weight:700}
    .frame-wrap{flex:1;display:flex}
    iframe{flex:1;border:0;height:100%}
    @media (max-width:800px){.sidebar{display:none}.wrap{flex-direction:column}.toolbar{position:sticky;top:0;z-index:10}}
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="sidebar">
      <div class="brand">工具合集</div>
      <ul class="nav" id="nav">
        <li><button data-src="json/index.html" class="active">JSON 编辑器<span class="small">编辑/格式化/历史</span></button></li>
        <li><button data-src="tool/index.html">URL 编码/解码<span class="small">组件 & 完整 URL</span></button></li>
      </ul>

      <div class="actions">
        <a id="open-json" href="json/index.html" target="_blank">在新标签打开 JSON</a>
        <a id="open-tool" href="tool/index.html" target="_blank">在新标签打开 URL 工具</a>
      </div>

      <p style="margin-top:18px;font-size:13px;color:#666">提示：左侧选择功能，右侧区域会加载对应页面。所有资源保留在子目录中。</p>
    </aside>

    <section class="main">
      <div class="toolbar">
        <div class="title" id="title">JSON 编辑器</div>
        <div style="flex:1"></div>
        <div style="font-size:13px;color:#666">由子模块提供功能</div>
      </div>

      <div class="frame-wrap">
        <iframe id="contentFrame" src="json/index.html" title="工具内容"></iframe>
      </div>
    </section>
  </div>

  <script>
    const nav = document.getElementById('nav');
    const title = document.getElementById('title');
    const frame = document.getElementById('contentFrame');

    nav.addEventListener('click', (e)=>{
      const btn = e.target.closest('button');
      if(!btn) return;
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const src = btn.dataset.src;
      frame.src = src;
      const txt = btn.textContent.trim().split('\n')[0];
      title.textContent = txt;
    });

    // keep "open in new tab" links in sync
    document.getElementById('open-json').href = 'json/index.html';
    document.getElementById('open-tool').href = 'tool/index.html';
  </script>
</body>
</html>
