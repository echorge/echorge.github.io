<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 编码/解码工具</title>
    <style>
        :root {
            --bg: #f6f8fa;
            --accent: #667eea;
            --accent-hover: #5568d3;
            --text: #333;
            --text-secondary: #666;
            --border: #e6e9ef;
            --card-bg: #fff;
            --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            padding: 24px;
            color: var(--text);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
            text-align: center;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            font-family: var(--font);
        }

        .tab-btn:hover { color: var(--text); background: #f0f2f5; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tool sections */
        .tool-section { margin-bottom: 32px; }
        .tool-section:last-child { margin-bottom: 0; }

        .tool-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--text);
            background: #fafbfc;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
            background: #fff;
        }

        textarea::placeholder { color: #aaa; }

        .button-group { display: flex; gap: 8px; margin-top: 8px; }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #f0f2f5;
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #e4e7ec;
        }

        .output-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .output {
            background: #fafbfc;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 13px;
            word-break: break-all;
            min-height: 40px;
            max-height: 160px;
            overflow-y: auto;
            color: var(--text);
            line-height: 1.5;
        }

        .output:empty::before {
            content: '输出将在此显示...';
            color: #aaa;
        }

        .message {
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
            font-size: 13px;
        }
        .message.show { display: block; }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 20px; }
            h1 { font-size: 18px; }
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL 编码/解码工具</h1>

        <div class="tabs">
            <button class="tab-btn active" data-tab="component">组件方式</button>
            <button class="tab-btn" data-tab="full">完整 URL 方式</button>
        </div>

        <!-- 组件编码解码 -->
        <div id="component" class="tab-content active">
            <div class="tool-section">
                <div class="tool-title">编码字符串组件</div>
                <div class="form-group">
                    <label for="encode-input">输入要编码的文本</label>
                    <textarea id="encode-input" placeholder="例如: hello world & 特殊符号"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="encodeComponent()">编码</button>
                    <button class="btn-secondary" onclick="clearEncode()">清空</button>
                </div>
                <div class="output-label">编码结果</div>
                <div id="encode-output" class="output"></div>
                <div id="encode-message" class="message"></div>
            </div>

            <div class="tool-section">
                <div class="tool-title">解码字符串组件</div>
                <div class="form-group">
                    <label for="decode-input">输入要解码的文本</label>
                    <textarea id="decode-input" placeholder="例如: hello%20world%20%26%20%E7%89%B9%E6%AE%8A%E7%AC%A6%E5%8F%B7"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="decodeComponent()">解码</button>
                    <button class="btn-secondary" onclick="clearDecode()">清空</button>
                </div>
                <div class="output-label">解码结果</div>
                <div id="decode-output" class="output"></div>
                <div id="decode-message" class="message"></div>
            </div>
        </div>

        <!-- 完整URL编码解码 -->
        <div id="full" class="tab-content">
            <div class="tool-section">
                <div class="tool-title">编码完整 URL</div>
                <div class="form-group">
                    <label for="encode-url-input">输入要编码的 URL</label>
                    <textarea id="encode-url-input" placeholder="例如: https://example.com/path?q=hello world"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="encodeURL()">编码 URL</button>
                    <button class="btn-secondary" onclick="clearEncodeURL()">清空</button>
                </div>
                <div class="output-label">编码结果</div>
                <div id="encode-url-output" class="output"></div>
                <div id="encode-url-message" class="message"></div>
            </div>

            <div class="tool-section">
                <div class="tool-title">解码完整 URL</div>
                <div class="form-group">
                    <label for="decode-url-input">输入要解码的 URL</label>
                    <textarea id="decode-url-input" placeholder="例如: https://example.com/path?q=hello%20world"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="decodeURL()">解码 URL</button>
                    <button class="btn-secondary" onclick="clearDecodeURL()">清空</button>
                </div>
                <div class="output-label">解码结果</div>
                <div id="decode-url-output" class="output"></div>
                <div id="decode-url-message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="./urlCodec.js"></script>
    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabName = this.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        function showMessage(el, text, type) {
            el.textContent = text;
            el.className = 'message show ' + type;
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function encodeComponent() {
            const input = document.getElementById('encode-input').value;
            const output = document.getElementById('encode-output');
            const msg = document.getElementById('encode-message');
            if (!input) { showMessage(msg, '请输入要编码的文本', 'error'); output.textContent = ''; return; }
            try {
                const result = urlCodec.encode(input);
                output.textContent = result;
                showMessage(msg, '编码成功！已复制到剪贴板', 'success');
                navigator.clipboard.writeText(result);
            } catch (e) { showMessage(msg, '编码失败: ' + e.message, 'error'); output.textContent = ''; }
        }

        function clearEncode() {
            document.getElementById('encode-input').value = '';
            document.getElementById('encode-output').textContent = '';
            document.getElementById('encode-message').classList.remove('show');
        }

        function decodeComponent() {
            const input = document.getElementById('decode-input').value;
            const output = document.getElementById('decode-output');
            const msg = document.getElementById('decode-message');
            if (!input) { showMessage(msg, '请输入要解码的文本', 'error'); output.textContent = ''; return; }
            try {
                const result = urlCodec.decode(input);
                output.textContent = result;
                showMessage(msg, '解码成功！已复制到剪贴板', 'success');
                navigator.clipboard.writeText(result);
            } catch (e) { showMessage(msg, '解码失败: ' + e.message, 'error'); output.textContent = ''; }
        }

        function clearDecode() {
            document.getElementById('decode-input').value = '';
            document.getElementById('decode-output').textContent = '';
            document.getElementById('decode-message').classList.remove('show');
        }

        function encodeURL() {
            const input = document.getElementById('encode-url-input').value;
            const output = document.getElementById('encode-url-output');
            const msg = document.getElementById('encode-url-message');
            if (!input) { showMessage(msg, '请输入要编码的 URL', 'error'); output.textContent = ''; return; }
            try {
                const result = urlCodec.encodeURL(input);
                output.textContent = result;
                showMessage(msg, '编码成功！已复制到剪贴板', 'success');
                navigator.clipboard.writeText(result);
            } catch (e) { showMessage(msg, '编码失败: ' + e.message, 'error'); output.textContent = ''; }
        }

        function clearEncodeURL() {
            document.getElementById('encode-url-input').value = '';
            document.getElementById('encode-url-output').textContent = '';
            document.getElementById('encode-url-message').classList.remove('show');
        }

        function decodeURL() {
            const input = document.getElementById('decode-url-input').value;
            const output = document.getElementById('decode-url-output');
            const msg = document.getElementById('decode-url-message');
            if (!input) { showMessage(msg, '请输入要解码的 URL', 'error'); output.textContent = ''; return; }
            try {
                const result = urlCodec.decodeURL(input);
                output.textContent = result;
                showMessage(msg, '解码成功！已复制到剪贴板', 'success');
                navigator.clipboard.writeText(result);
            } catch (e) { showMessage(msg, '解码失败: ' + e.message, 'error'); output.textContent = ''; }
        }

        function clearDecodeURL() {
            document.getElementById('decode-url-input').value = '';
            document.getElementById('decode-url-output').textContent = '';
            document.getElementById('decode-url-message').classList.remove('show');
        }
    </script>
</body>
</html>
