<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 编辑器</title>
  <link rel="manifest" href="manifest.json" />

  <script src="./resources/cache.js"></script>

  <link href="./resources/jsoneditor.css" rel="stylesheet" type="text/css">
  <link href="./resources/main.css" rel="stylesheet" type="text/css">
  <link href="./resources/toast.min.css" rel="stylesheet" type="text/css">

  <script src="./resources/localforage.min.js"></script>
  <script src="./resources/jsoneditor.js"></script>
  <script src="./resources/toast.min.js"></script>

  <style>
    :root {
      --accent: #667eea;
      --accent-hover: #5568d3;
      --bg: #f6f8fa;
      --header-bg: #fff;
      --border: #e6e9ef;
      --text: #333;
      --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar .brand {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }

    .toolbar .badge {
      font-size: 11px;
      background: #eef0f5;
      color: #666;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 500;
    }

    .toolbar .spacer { flex: 1; }

    .toolbar .hint {
      font-size: 12px;
      color: #999;
    }

    /* JSONEditor container */
    #jsoneditor {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* Override jsoneditor default styles */
    .jsoneditor {
      border: none !important;
      border-radius: 0 !important;
    }

    .jsoneditor-tree {
      background: #fff !important;
    }

    .jsoneditor-search {
      background: var(--header-bg) !important;
    }

    @media (max-width: 600px) {
      .toolbar .badge { display: none; }
      .toolbar .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="brand">📋 JSON 编辑器</span>
    <span class="badge">Editor</span>
    <span class="spacer"></span>
    <span class="hint">编辑 · 格式化 · 校验</span>
  </div>

  <div id="jsoneditor"></div>

  <script src="./resources/main.js"></script>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function () {
        console.log('Service Worker 注册成功');
      });
    }
  </script>
</body>
</html>
